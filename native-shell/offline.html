<!doctype html>
<html lang="en"><head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Ontrack · offline</title>
<style>
  :root { color-scheme: light dark; --bg:#fffbfe; --fg:#1c1b1f; --mu:#49454e; --pr:#6750a4; --on:#fff; }
  @media (prefers-color-scheme: dark) { :root { --bg:#141218; --fg:#e6e0e9; --mu:#cac4d0; --pr:#d0bcff; --on:#381e72; } }
  html,body { height:100%; margin:0; background:var(--bg); color:var(--fg); font-family:Roboto,system-ui,sans-serif; }
  main { height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; padding:24px; box-sizing:border-box; text-align:center; }
  .logo { width:56px; height:56px; border-radius:16px; background:var(--pr); color:var(--on); display:grid; place-items:center; font-size:28px; }
  h1 { font:500 22px/28px inherit; margin:8px 0 0; } p { margin:0; color:var(--mu); font-size:15px; line-height:22px; max-width:320px; }
  button { margin-top:12px; height:44px; padding:0 24px; border:0; border-radius:22px; background:var(--pr); color:var(--on); font:500 15px inherit; }
</style></head>
<body><main>
  <div class="logo">⏱</div>
  <h1>You’re offline</h1>
  <p>Ontrack keeps your tasks in your account, so it needs the internet to load. Check your connection and try again.</p>
  <button onclick="location.href='https://beingontrack.vercel.app/my-day'">Try again</button>
</main>
<script>window.addEventListener('online', function () { location.href = 'https://beingontrack.vercel.app/my-day'; });</script>
</body></html>
